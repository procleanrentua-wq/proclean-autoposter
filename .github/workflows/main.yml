name: PRO-CLEAN RENT AutoPoster 2x Daily (08:45 & 19:15 Kyiv)

on:
  schedule:
    # 1) Ранковий кавовий пік у Дрогобицькій громаді: щодня о 08:45 за Києвом (06:45 UTC)
    - cron: '45 6 * * *'
    # 2) Вечірній прайм-тайм після роботи: щодня о 19:15 за Києвом (17:15 UTC)
    - cron: '15 17 * * *'

  # Ручний запуск у будь-який момент кнопкою "Run workflow"
  workflow_dispatch:
    inputs:
      topic_index:
        description: 'Номер теми від 0 до 6 (залиште порожнім для автоматичного вибору)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish_post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate new realistic photo + text and publish to FB & Instagram
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FORCE_TOPIC_INDEX: ${{ github.event.inputs.topic_index }}
        run: |
          if [ -z "$FORCE_TOPIC_INDEX" ]; then
            HOUR_UTC=$(date -u +%H)
            DAY_OF_YEAR=$(date -u +%j | sed 's/^0*//')
            if [ "$HOUR_UTC" -lt 12 ]; then
              export FORCE_TOPIC_INDEX=$(( (DAY_OF_YEAR * 2) % 7 ))
            else
              export FORCE_TOPIC_INDEX=$(( (DAY_OF_YEAR * 2 + 1) % 7 ))
            fi
          fi
          python3 autopost.py

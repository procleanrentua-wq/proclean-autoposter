name: PRO-CLEAN RENT AutoPoster 2x Daily (08:45 & 19:15 Kyiv)

on:
  schedule:
    - cron: '45 6 * * *'
    - cron: '15 17 * * *'

  workflow_dispatch:
    inputs:
      topic_index:
        description: 'Номер теми від 0 до 7 (залиште порожнім для автоматичного вибору)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish_post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 & Pillow
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow & Fonts for card generation
        run: |
          sudo apt-get update -y && sudo apt-get install -y fonts-dejavu-core
          pip install --quiet Pillow

      - name: Generate weather & holiday post + hybrid card and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FORCE_TOPIC_INDEX: ${{ github.event.inputs.topic_index }}
        run: |
          if [ -z "$FORCE_TOPIC_INDEX" ]; then
            unset FORCE_TOPIC_INDEX
          fi
          python3 autopost.py
